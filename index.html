<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>김태헌 웹 명함</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" aria-label="웹 명함">
        <div class="avatar-wrap">
          <div class="avatar" role="img" aria-label="멋진 캐릭터 얼굴 일러스트">
            <div class="glow"></div>
            <div class="hair"></div>
            <div class="hair-shine"></div>
            <div class="ear ear-left"></div>
            <div class="ear ear-right"></div>
            <div class="face">
              <span class="brow brow-left"></span>
              <span class="brow brow-right"></span>
              <span class="eye eye-left"></span>
              <span class="eye eye-right"></span>
              <span class="blush blush-left"></span>
              <span class="blush blush-right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
            </div>
            <div class="collar"></div>
          </div>
        </div>

        <div class="content">
          <h1 class="name">김태헌</h1>
          <p class="job">SideOnAI 대표</p>
          <p class="intro">"AI와 함께 놀고 있습니다. 같이 노실 분?"</p>

          <ul class="contact-list">
            <li>
              <span class="label">이메일</span>
              <a href="mailto:th@sideonai.com">th@sideonai.com</a>
            </li>
            <li>
              <span class="label">연락처</span>
              <a href="tel:01011111111">010-1111-1111</a>
            </li>
          </ul>

          <div class="actions">
            <button id="copyBtn" class="copy-btn" type="button">
              연락처 복사
            </button>
            <a
              class="linkedin-btn"
              href="https://www.linkedin.com/"
              target="_blank"
              rel="noopener noreferrer"
              >LinkedIn</a
            >
          </div>
          <p id="statusText" class="status-text" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
